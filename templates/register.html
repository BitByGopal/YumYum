{% extends "base.html" %}
{% block content %}

<div class="min-h-[80vh] flex items-center justify-center py-8">
  <div class="w-full max-w-md">

    <div class="bg-white rounded-3xl shadow-xl p-8">
      <div class="text-center mb-8">
        <span class="text-4xl">🎉</span>
        <h2 class="text-3xl font-display font-extrabold text-gray-900 mt-3">Create account</h2>
        <p class="text-gray-400 text-sm mt-1">Join YumYum and start ordering</p>
      </div>

      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
          <input
            type="text" name="username" required
            placeholder="Choose a username"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input
            type="email" name="email" required
            placeholder="Your email address"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input
            type="password" name="password" required
            placeholder="Min 6 characters"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
          <input
            type="password" name="confirm_password" required
            placeholder="Repeat password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        <!-- Role Selection -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">I am a...</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-brand transition-all has-[:checked]:border-brand has-[:checked]:bg-orange-50">
              <input type="radio" name="role" value="customer" checked class="accent-brand"/>
              <span class="text-sm font-medium">🙋 Customer</span>
            </label>
            <label class="flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-brand transition-all has-[:checked]:border-brand has-[:checked]:bg-orange-50">
              <input type="radio" name="role" value="restaurant" class="accent-brand"/>
              <span class="text-sm font-medium">🍴 Restaurant</span>
            </label>
          </div>
        </div>

        {% if error %}
          <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm">
            ⚠️ {{ error }}
          </div>
        {% endif %}

        <button type="submit" class="btn-brand w-full py-3 rounded-xl font-bold text-base mt-2">
          Create Account →
        </button>
      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        Already have an account?
        <a href="/login/" class="text-brand font-semibold hover:underline">Login</a>
      </p>
    </div>

  </div>
</div>

{% endblock %}
