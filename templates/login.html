{% extends "base.html" %}
{% block content %}

<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8">
      <div class="text-center mb-8">
        <span class="text-4xl">🍔</span>
        <h2 class="text-3xl font-display font-extrabold text-gray-900 mt-3">Welcome back</h2>
        <p class="text-gray-400 text-sm mt-1">Login to your YumYum account</p>
      </div>

      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
          <input
            type="text" name="username" required
            placeholder="Enter your username"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input
            type="password" name="password" required
            placeholder="Enter your password"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
          />
        </div>

        {% if error %}
          <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm">
            ⚠️ {{ error }}
          </div>
        {% endif %}

        <button type="submit" class="btn-brand w-full py-3 rounded-xl font-bold text-base mt-2">
          Login →
        </button>
      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        Don't have an account?
        <a href="/register/" class="text-brand font-semibold hover:underline">Register</a>
      </p>
    </div>

  </div>
</div>

{% endblock %}
